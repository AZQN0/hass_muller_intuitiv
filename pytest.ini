[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --tb=short
    -m "not real_api"
    --cov=custom_components.muller_intuitiv
    --cov-report=term-missing
    --cov-report=html:htmlcov
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    real_api: tests that call the real Muller Intuitiv cloud API
    enable_socket: tests that need outbound socket access
