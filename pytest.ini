[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --tb=short
    --cov=custom_components.muller_intuitiv
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=95
    --asyncio-mode=auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning